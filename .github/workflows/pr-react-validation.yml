name: Validate Voidly React

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
    # Skip CI for documentation-only changes; code changes still run the UI build.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE*'

permissions:
  contents: read

concurrency:
  group: react-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-react:
    name: Build React UI
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.2'
          cache: 'npm'

      - name: Setup Python (needed by native node-gyp dependencies)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Enable MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build React products
        run: npm run buildreact
