name: Release Voidly (Windows x64)

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - '*'
    # Documentation-only and workflow-only changes do not need a Windows package.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/workflows/**'
      - 'LICENSE*'
  workflow_dispatch:

# Least privilege by default. Only the release job receives contents: write.
permissions:
  contents: read

# Avoid wasting Windows runners on superseded branch/PR builds. Keep tag
# builds independent so publishing one version cannot cancel another.
concurrency:
  group: voidly-windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Always run a tiny diff check for PRs/pushes. Documentation-only changes
  # complete this job quickly and skip the expensive Windows packaging job.
  detect-changes:
    name: Detect build-relevant changes
    runs-on: ubuntu-latest
    outputs:
      build_required: ${{ steps.diff.outputs.build_required }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check changed paths
        id: diff
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$GITHUB_REF" == refs/tags/* ]]; then
            echo "build_required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            FROM_SHA="$BASE_SHA"
          else
            FROM_SHA="$BEFORE_SHA"
          fi

          if [[ -z "$FROM_SHA" || "$FROM_SHA" =~ ^0+$ ]]; then
            echo "build_required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet "$FROM_SHA" "$HEAD_SHA" -- . \
            ':(exclude)*.md' \
            ':(exclude)**/*.md' \
            ':(exclude)*.mdx' \
            ':(exclude)**/*.mdx' \
            ':(exclude)docs/**' \
            ':(exclude)documentation/**' \
            ':(exclude)LICENSE' \
            ':(exclude)LICENSE.*' \
            ':(exclude)NOTICE' \
            ':(exclude).github/ISSUE_TEMPLATE/**'; then
            echo "Documentation-only change: skipping Windows packaging."
            echo "build_required=false" >> "$GITHUB_OUTPUT"
          else
            echo "Build-relevant change detected."
            echo "build_required=true" >> "$GITHUB_OUTPUT"
          fi

  build-windows-x64:
    name: Build Windows x64
    needs: detect-changes
    if: needs.detect-changes.outputs.build_required == 'true'
    runs-on: windows-2022
    permissions:
      contents: read
    env:
      # Disable CodeBuddy safe-delete shim (harmless on GitHub-hosted runners,
      # required when running locally under CodeBuddy). Without this, gulp's
      # rimraf batch deletes get blocked.
      CODEBUDDY_SAFE_DELETE_ENABLED: '0'
      # VS Code-scale builds need a large heap; mirror the local gulp setting.
      NODE_OPTIONS: '--max-old-space-size=8192'
      GYP_MSVS_VERSION: '2022'
      npm_config_msvs_version: '2022'
      # Use the mirror for Electron downloads; @electron/get still validates
      # the downloaded archive against its checksum.
      ELECTRON_MIRROR: 'https://npmmirror.com/mirrors/electron/'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20.18.2'
          cache: 'npm'

      - name: Setup Python (needed by some native node-gyp deps)
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # windows-2022 ships Visual Studio 2022 + Windows SDK.
      - name: Enable MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure npm cache & install
        shell: powershell
        run: npm ci --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000

      # Build Void's React subproject (required; gulp does NOT cover this).
      - name: Build React products
        shell: powershell
        run: npm run buildreact

      # Pre-download Electron so packaging can reuse the checksum-verified file.
      - name: Download Electron binary
        shell: powershell
        run: |
          node build/lib/electron.js 2>&1 | Tee-Object -FilePath electron-download.log
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Electron download failed - see electron-download.log"
            Exit $LASTEXITCODE
          }

      # The gulp task compiles src->out-build internally.
      - name: Package Windows x64
        shell: powershell
        run: |
          node ./node_modules/gulp/bin/gulp.js vscode-win32-x64 2>&1 | Tee-Object -FilePath packaging.log
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Packaging task failed - see packaging.log"
            Exit $LASTEXITCODE
          }

      # This task creates the tools directory required by the Inno Setup script.
      - name: Build Inno Setup updater (tools dir)
        shell: powershell
        run: |
          node ./node_modules/gulp/bin/gulp.js vscode-win32-x64-inno-updater 2>&1 | Tee-Object -FilePath inno-updater.log
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Inno updater task failed - see inno-updater.log"
            Exit $LASTEXITCODE
          }

      - name: Build Windows x64 System Setup (.exe)
        shell: powershell
        run: |
          node ./node_modules/gulp/bin/gulp.js vscode-win32-x64-system-setup 2>&1 | Tee-Object -FilePath setup.log
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Setup task failed - see setup.log"
            Exit $LASTEXITCODE
          }

      - name: Collect release artifacts
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null

          # Portable zip (from the gulp output dir, one level above workspace).
          $wsParent = [System.IO.Path]::GetDirectoryName($env:GITHUB_WORKSPACE)
          $appDir = Join-Path $wsParent "VSCode-win32-x64"
          if (-not (Test-Path $appDir)) {
            Write-Host "ERROR: packaged app directory not found at $appDir"
            Get-ChildItem $wsParent | ForEach-Object { Write-Host $_.FullName }
            Exit 1
          }
          $zipOut = Join-Path "dist" "Voidly-win32-x64.zip"
          Write-Host "Compressing $appDir -> $zipOut"
          Compress-Archive -Path "$appDir\*" -DestinationPath $zipOut -Force
          Write-Host "Created $zipOut ($([math]::Round((Get-Item $zipOut).Length/1MB,1)) MB)"

          # System installer .exe (inside repo: .build/win32-x64/system-setup).
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $setupSrc = ".build\win32-x64\system-setup\VSCodeSetup.exe"
          if (-not (Test-Path $setupSrc)) {
            Write-Host "ERROR: installer not found at $setupSrc"
            Exit 1
          }
          $setupOut = Join-Path "dist" "VoidlySetup-x64-$version.exe"
          Copy-Item -Path $setupSrc -Destination $setupOut -Force
          Write-Host "Created $setupOut ($([math]::Round((Get-Item $setupOut).Length/1MB,1)) MB)"

      # Only tagged builds need to transfer large binaries to the release job.
      - name: Upload release files
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v5
        with:
          name: windows-x64-release-files
          path: dist/*
          if-no-files-found: error
          retention-days: 3

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: build-logs
          path: |
            electron-download.log
            packaging.log
            inno-updater.log
            setup.log
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build-windows-x64
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@v5
        with:
          name: windows-x64-release-files
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/Voidly-win32-x64.zip
            dist/VoidlySetup-x64-*.exe
          name: Voidly ${{ github.ref_name }}
          body: |
            Voidly ${{ github.ref_name }} - Windows x64 build.

            - **VoidlySetup-x64-*.exe** — System installer
            - **Voidly-win32-x64.zip** — Portable build

            Independently developed and distributed by Zevino.
            Repository: https://github.com/Zevino/void
          draft: false
          prerelease: false
