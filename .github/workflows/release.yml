name: Release Voidly (Windows x64)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-x64:
    name: Build Windows x64
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.2'
          cache: 'npm'

      - name: Configure npm cache & install
        shell: powershell
        run: |
          # Ensure node-gyp picks up the Visual Studio version
          $env:GYP_MSVS_VERSION = '2022'
          $env:npm_config_msvs_version = '2022'
          npm ci --no-audit --no-fund
        env:
          CODEBUDDY_SAFE_DELETE_ENABLED: '0'
          NODE_OPTIONS: ''

      # Build Void's React subproject (required; gulp does NOT cover this)
      - name: Build React products
        shell: powershell
        run: npm run buildreact

      # Package Windows x64. The gulp task compiles src->out-build internally,
      # so the separate `npm run compile` step was redundant and is removed.
      # Output goes to <workspace-parent>/VSCode-win32-x64 (gulpfile quirk).
      - name: Package Windows x64
        shell: powershell
        run: |
          node ./node_modules/gulp/bin/gulp.js vscode-win32-x64 > packaging.log 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Packaging task failed — see packaging.log"
            Exit $LASTEXITCODE
          }

      - name: Zip the packaged app
        shell: powershell
        run: |
          $wsParent = [System.IO.Path]::GetDirectoryName($env:GITHUB_WORKSPACE)
          $appDir = Join-Path $wsParent "VSCode-win32-x64"
          if (-not (Test-Path $appDir)) {
            Write-Host "ERROR: packaged app directory not found at $appDir"
            Get-ChildItem $wsParent | ForEach-Object { Write-Host $_.FullName }
            Exit 1
          }
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          $zipOut = Join-Path "dist" "Voidly-win32-x64.zip"
          Write-Host "Compressing $appDir -> $zipOut"
          Compress-Archive -Path "$appDir\*" -DestinationPath $zipOut -Force
          Write-Host "Created $zipOut ($([math]::Round((Get-Item $zipOut).Length/1MB,1)) MB)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/Voidly-win32-x64.zip
          name: Voidly ${{ github.ref_name }}
          body: |
            Voidly ${{ github.ref_name }} — Windows x64 build.

            Independently developed and distributed by Zevino.
            Repository: https://github.com/Zevino/void
          draft: false
          prerelease: false

      - name: Upload packaging log on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: packaging-log
          path: packaging.log
