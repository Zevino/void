name: Release Voidly (Windows x64)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-x64:
    name: Build Windows x64
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.2'
          cache: 'npm'

      # VS2022 with Desktop C++ workload + Spectre-mitigated libs (matches local build env)
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install Windows SDK / Spectre libs
        shell: powershell
        run: |
          # Install the Spectre-mitigated ATL/MFC libs for v143 (required by node-gyp native builds)
          # This uses the VS installer to add the Spectre components without a full re-install.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & "$vswhere" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $installer = "$vsPath\Common7\IDE\VSInstaller.exe"
          if (Test-Path $installer) {
            Start-Process -Wait -FilePath $installer -ArgumentList "modify --installPath `"$vsPath`" --add Microsoft.VisualStudio.Component.VC.ATLMFC.Spectre --add Microsoft.VisualStudio.Component.VC.Tools.Spectre.x86.x64 --quiet --norestart"
          } else {
            Write-Host "VSInstaller.exe not found at $installer; assuming Spectre libs already present."
          }

      - name: Configure npm cache & install
        shell: powershell
        run: |
          # Ensure node-gyp picks up the Visual Studio version
          $env:GYP_MSVS_VERSION = '2022'
          # Also set npm_config_msvs_version so legacy consumers see the setting
          $env:npm_config_msvs_version = '2022'
          npm ci --no-audit --no-fund
        env:
          # Keep build clean (avoid any external safe-delete shims interfering)
          CODEBUDDY_SAFE_DELETE_ENABLED: '0'
          NODE_OPTIONS: ''

      - name: Build React products
        shell: powershell
        run: npm run buildreact

      - name: Compile
        shell: powershell
        run: npm run compile

      - name: Package Windows x64 (zip)
        shell: powershell
        run: |
          # Increase verbosity so packaging logs are visible
          $env:NPM_CONFIG_LOGLEVEL = "verbose"
          # Produces VSCode-win32-x64.zip (and VSCode-win32-x64/ dir) at repo root
          node ./node_modules/gulp/bin/gulp.js vscode-win32-x64

      - name: Install Inno Setup
        shell: powershell
        run: |
          # Inno Setup is required to build the .exe installer
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            Write-Host "Installing Inno Setup via Chocolatey..."
            choco install innosetup -y --no-progress
          } else {
            Write-Host "Inno Setup already present."
          }

      - name: Build installer (user setup)
        continue-on-error: true
        shell: powershell
        run: |
          # Produces .exe installer under .build/win32-x64/user-setup/
          node ./node_modules/gulp/bin/gulp.js vscode-win32-x64-user-setup

      - name: Locate build artifacts
        id: artifacts
        shell: powershell
        run: |
          Write-Host "Searching for build artifacts..."

          # The zip is produced at the repo root by the packaging task
          $zip = Get-ChildItem -Path "." -Filter "VSCode-win32-x64.zip" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $zip) {
            $zip = Get-ChildItem -Path "." -Recurse -Filter "VSCode-win32-x64.zip" -ErrorAction SilentlyContinue | Select-Object -First 1
          }

          # The installer .exe is produced by the inno setup task under .build/win32-x64/*-setup/
          $exe = Get-ChildItem -Path ".build" -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1

          if (-not $zip) {
            Write-Host "ERROR: Could not find VSCode-win32-x64.zip. Workspace tree:"
            Get-ChildItem -Path . -Recurse -File | ForEach-Object { Write-Host $_.FullName }
            Exit 1
          }
          if (-not $exe) {
            Write-Host "WARNING: Could not find installer .exe; release will include zip only."
          }

          Write-Host "Found zip: $($zip.FullName)"
          if ($exe) { Write-Host "Found exe: $($exe.FullName)" }

          "zipPath=$($zip.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          if ($exe) { "exePath=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append }

      - name: Upload build artifacts for debugging
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-debug
          path: |
            ${{ steps.artifacts.outputs.zipPath }}
            ${{ steps.artifacts.outputs.exePath }}

      - name: Create GitHub Release (zip)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ steps.artifacts.outputs.zipPath }}
          name: Voidly ${{ github.ref_name }}
          body: |
            Voidly ${{ github.ref_name }} — Windows x64 build.

            Independently developed and distributed by Zevino.
            Repository: https://github.com/Zevino/void
          draft: false
          prerelease: false

      - name: Attach installer to release (if present)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') && steps.artifacts.outputs.exePath != ''
        with:
          files: ${{ steps.artifacts.outputs.exePath }}
          name: Voidly ${{ github.ref_name }}
