name: Release Voidly (Windows x64)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-x64:
    name: Build Windows x64
    runs-on: windows-2022
    env:
      # Disable CodeBuddy safe-delete shim (harmless on GitHub-hosted runners,
      # required when running locally under CodeBuddy). Without this, gulp's
      # rimraf batch deletes get blocked.
      CODEBUDDY_SAFE_DELETE_ENABLED: '0'
      # VS Code-scale builds need a large heap; the default 2 GB cap makes the
      # gulp packaging step OOM-crash after a few minutes. Mirror the local
      # `--max-old-space-size=8192` used by the `gulp` npm script.
      NODE_OPTIONS: '--max-old-space-size=8192'
      GYP_MSVS_VERSION: '2022'
      npm_config_msvs_version: '2022'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.2'
          cache: 'npm'

      - name: Setup Python (needed by some native node-gyp deps)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # windows-2022 ships Visual Studio 2022 + Windows SDK. Activating the MSVC
      # dev environment explicitly makes node-gyp reliably pick up the compiler
      # for native modules (node-pty, native-keymap, etc.) during the build.
      - name: Enable MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure npm cache & install
        shell: powershell
        run: npm ci --no-audit --no-fund

      # Build Void's React subproject (required; gulp does NOT cover this)
      - name: Build React products
        shell: powershell
        run: npm run buildreact

      # Package Windows x64. The gulp task compiles src->out-build internally,
      # so the separate `npm run compile` step was redundant and is removed.
      # Output goes to <workspace-parent>/VSCode-win32-x64 (gulpfile quirk).
      #
      # We DO NOT silence stderr. The previous `> packaging.log 2>&1` hid the
      # real failure reason behind a generic `NativeCommandError`, making the
      # build impossible to diagnose. Logs are still captured (tee) and uploaded
      # on failure, but the error is now visible inline.
      - name: Package Windows x64
        shell: powershell
        run: |
          node ./node_modules/gulp/bin/gulp.js vscode-win32-x64 2>&1 | Tee-Object -FilePath packaging.log
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Packaging task failed - see packaging.log"
            Exit $LASTEXITCODE
          }

      # The Inno Setup script expects a `tools` directory inside the packaged
      # app (inno_updater.exe + vcruntime140.dll). It is produced by a separate
      # gulp task and is NOT a dependency of the setup tasks.
      - name: Build Inno Setup updater (tools dir)
        shell: powershell
        run: |
          node ./node_modules/gulp/bin/gulp.js vscode-win32-x64-inno-updater 2>&1 | Tee-Object -FilePath inno-updater.log
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Inno updater task failed - see inno-updater.log"
            Exit $LASTEXITCODE
          }

      - name: Build Windows x64 System Setup (.exe)
        shell: powershell
        run: |
          node ./node_modules/gulp/bin/gulp.js vscode-win32-x64-system-setup 2>&1 | Tee-Object -FilePath setup.log
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Setup task failed - see setup.log"
            Exit $LASTEXITCODE
          }

      - name: Collect release artifacts
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null

          # Portable zip (from the gulp output dir, one level above workspace)
          $wsParent = [System.IO.Path]::GetDirectoryName($env:GITHUB_WORKSPACE)
          $appDir = Join-Path $wsParent "VSCode-win32-x64"
          if (-not (Test-Path $appDir)) {
            Write-Host "ERROR: packaged app directory not found at $appDir"
            Get-ChildItem $wsParent | ForEach-Object { Write-Host $_.FullName }
            Exit 1
          }
          $zipOut = Join-Path "dist" "Voidly-win32-x64.zip"
          Write-Host "Compressing $appDir -> $zipOut"
          Compress-Archive -Path "$appDir\*" -DestinationPath $zipOut -Force
          Write-Host "Created $zipOut ($([math]::Round((Get-Item $zipOut).Length/1MB,1)) MB)"

          # System installer .exe (inside repo: .build/win32-x64/system-setup)
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $setupSrc = ".build\win32-x64\system-setup\VSCodeSetup.exe"
          if (-not (Test-Path $setupSrc)) {
            Write-Host "ERROR: installer not found at $setupSrc"
            Exit 1
          }
          $setupOut = Join-Path "dist" "VoidlySetup-x64-$version.exe"
          Copy-Item -Path $setupSrc -Destination $setupOut -Force
          Write-Host "Created $setupOut ($([math]::Round((Get-Item $setupOut).Length/1MB,1)) MB)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/Voidly-win32-x64.zip
            dist/VoidlySetup-x64-*.exe
          name: Voidly ${{ github.ref_name }}
          body: |
            Voidly ${{ github.ref_name }} - Windows x64 build.

            - **VoidlySetup-x64-*.exe** — System installer
            - **Voidly-win32-x64.zip** — Portable build

            Independently developed and distributed by Zevino.
            Repository: https://github.com/Zevino/void
          draft: false
          prerelease: false

      - name: Upload logs on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs
          path: |
            packaging.log
            inno-updater.log
            setup.log
